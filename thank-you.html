<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You — Water Splash for the Youths</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ocean-deep:#052a4a;
    --sun:#ffc93c;
    --coral:#ff5c8a;
    --leaf:#3ecf7e;
    --foam:#f4fbff;
    --ink:#04223c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:'Inter',Arial,sans-serif; color:var(--foam);
    background:linear-gradient(180deg, var(--ocean-deep) 0%, #073a63 55%, #052a4a 100%);
    padding:24px;
  }
  .card{
    max-width:440px; text-align:center; background:rgba(255,255,255,0.06);
    border:1px solid rgba(244,251,255,0.14); border-radius:20px; padding:40px 28px;
  }
  .icon{font-size:52px; margin-bottom:8px;}
  h1{font-family:'Baloo 2',sans-serif; font-size:28px; margin:0 0 10px; color:var(--sun);}
  p{font-size:15px; line-height:1.6; color:rgba(244,251,255,0.85);}
  .ref{
    font-family:monospace; font-size:14px; background:rgba(0,0,0,0.25);
    padding:10px 14px; border-radius:10px; margin:18px 0; word-break:break-all;
  }
  .status{font-weight:700; margin-top:6px;}
  .status.paid{color:var(--leaf);}
  .status.pending{color:var(--sun);}
  .status.failed{color:var(--coral);}
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🎉</div>
    <h1>Thank You!</h1>
    <p id="mainMsg">Checking your payment status…</p>
    <div class="ref" id="refBox" style="display:none;">Reference: <span id="refCode"></span></div>
    <p style="font-size:13px; color:rgba(244,251,255,0.6);">
      If your payment was successful, your ticket QR code(s) have been sent to your email.
      Didn't get it? Check your spam folder, or contact us with your reference above.
    </p>
  </div>

  <script>
    const BACKEND_URL = "https://water-splash-backend.onrender.com";
    const params = new URLSearchParams(window.location.search);
    const reference = params.get('reference') || params.get('trxref');

    function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

    async function confirmPayment(){
      const maxAttempts = 6;
      for(let attempt = 1; attempt <= maxAttempts; attempt++){
        try {
          const res = await fetch(`${BACKEND_URL}/api/checkout/confirm/${encodeURIComponent(reference)}`);
          const data = await res.json();

          if(data.status === 'fulfilled'){
            document.getElementById('mainMsg').innerHTML =
              'Payment confirmed! <span class="status paid">Your ticket is on its way to your email 🎫</span>';
            return;
          }
          if(res.status === 404){
            document.getElementById('mainMsg').innerHTML =
              '<span class="status failed">We could not find this order.</span> If you were charged, please contact us with your reference below.';
            return;
          }
          // status is "pending" — wait and retry
        } catch (err) {
          // network hiccup — just retry
        }
        await sleep(3000);
      }
      // Ran out of attempts — still pending
      document.getElementById('mainMsg').innerHTML =
        '<span class="status pending">Still confirming your payment.</span> This can take a minute — your ticket will be emailed automatically once confirmed.';
    }

    if(reference){
      document.getElementById('refCode').textContent = reference;
      document.getElementById('refBox').style.display = 'block';
      confirmPayment();
    } else {
      document.getElementById('mainMsg').textContent =
        "We couldn't find a payment reference. If you completed a payment, please check your email for your ticket.";
    }
  </script>
</body>
</html>
